
name: RITMO - Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || { echo 'ERRO: settings.gradle.kts ausente'; exit 1; }
          test -f build.gradle.kts || { echo 'ERRO: build.gradle.kts ausente'; exit 1; }
          test -f app/build.gradle.kts || { echo 'ERRO: app/build.gradle.kts ausente'; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo 'ERRO: AndroidManifest.xml ausente'; exit 1; }
          echo 'Estrutura do projeto OK.'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo 'ERRO: sdkmanager nao encontrado.'
            exit 1
          fi
          echo "Android SDK: $SDK_ROOT"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Compilar APK debug
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RITMO-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

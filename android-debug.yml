name: RITMO - Compilar APK (corrigido)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verificar projeto e Android SDK
        shell: bash
        run: |
          test -f settings.gradle.kts || { echo 'ERRO: settings.gradle.kts não está na raiz'; exit 1; }
          test -f app/build.gradle.kts || { echo 'ERRO: app/build.gradle.kts não encontrado'; exit 1; }
          echo "ANDROID_HOME=${ANDROID_HOME}"
          command -v sdkmanager
          sdkmanager --version

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RITMO-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
